<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a3a">
<title>墨漂模拟器</title>
<meta name="description" content="随机投胎成一个刚落地墨尔本的华人，看看你能漂出什么结局。">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- 顶部属性条：游戏中显示 -->
  <header id="hud" class="hud hidden">
    <div class="hud-top">
      <span id="hud-identity" class="hud-identity"></span>
      <span id="hud-year" class="hud-year"></span>
    </div>
    <div id="hud-attrs" class="hud-attrs"></div>
  </header>

  <!-- 开始页 -->
  <section id="screen-start" class="screen active">
    <div class="hero">
      <div class="hero-tram">🚋</div>
      <h1 class="title">墨漂模拟器</h1>
      <p class="subtitle">Melbourne Life Restart</p>
      <p class="tagline">随机投胎成一个刚落地墨尔本的华人<br>看看你这辈子能漂出什么结局</p>
    </div>
    <div class="start-actions">
      <button id="btn-start" class="btn btn-primary btn-big">开始投胎</button>
      <button id="btn-gallery" class="btn btn-ghost">结局图鉴</button>
      <p id="start-stats" class="muted small"></p>
    </div>
    <footer class="foot muted small">
      一天四季 · Myki · 学区房 · PR 打分 · Box Hill 火锅<br>
      所有事件纯属玩笑，如有雷同，那你也是墨漂<br>
      <button id="btn-submit" class="btn btn-link small">投稿你的墨尔本事件 →</button>
    </footer>
  </section>

  <!-- 身份选择 -->
  <section id="screen-identity" class="screen">
    <h2 class="screen-title">你是哪种墨漂？</h2>
    <p class="muted small center">身份决定你会遇到哪些事</p>
    <div id="identity-list" class="identity-list"></div>
  </section>

  <!-- 初始加点 -->
  <section id="screen-points" class="screen">
    <h2 class="screen-title">分配初始点数</h2>
    <p class="muted small center">剩余 <b id="points-left">20</b> 点，每项最高 10</p>
    <div id="points-list" class="points-list"></div>
    <div class="row gap">
      <button id="btn-random" class="btn btn-ghost">随机分配</button>
      <button id="btn-begin" class="btn btn-primary" disabled>落地墨尔本</button>
    </div>
  </section>

  <!-- 人生进程 -->
  <section id="screen-life" class="screen">
    <div id="life-log" class="life-log"></div>
    <div id="life-controls" class="life-controls">
      <div id="choice-box" class="choice-box hidden"></div>
      <button id="btn-next" class="btn btn-primary btn-wide">继续</button>
    </div>
  </section>

  <!-- 结局 -->
  <section id="screen-ending" class="screen">
    <div id="ending-card" class="ending-card"></div>
    <div class="ending-stats" id="ending-stats"></div>
    <div class="row gap">
      <button id="btn-share" class="btn btn-primary">生成结局卡</button>
      <button id="btn-restart" class="btn btn-ghost">再来一世</button>
    </div>
    <div class="row center-row">
      <button id="btn-review" class="btn btn-link small">回顾这一生</button>
      <button id="btn-submit-end" class="btn btn-link small">投稿事件</button>
    </div>
    <div id="share-preview" class="share-preview hidden">
      <img id="share-img" alt="结局卡">
      <p class="muted small center">长按图片保存，发到小红书或群里</p>
      <div class="row gap">
        <button id="btn-share-native" class="btn btn-primary">分享</button>
        <button id="btn-share-close" class="btn btn-ghost">关闭</button>
      </div>
    </div>
  </section>

  <!-- 结局图鉴 -->
  <section id="screen-gallery" class="screen">
    <h2 class="screen-title">结局图鉴</h2>
    <p id="gallery-sub" class="muted small center"></p>
    <div id="gallery-grid" class="gallery-grid"></div>
    <button id="btn-gallery-back" class="btn btn-ghost btn-wide">返回</button>
  </section>

  <!-- 投稿弹窗 -->
  <div id="submit-modal" class="modal hidden">
    <div class="modal-card">
      <h3>投稿你的墨尔本事件</h3>
      <p class="muted small">把下面的模板填好，发到群里或小红书艾特我们。被选中的事件会署上你的名字。</p>
      <textarea id="submit-text" rows="7" readonly></textarea>
      <div class="row gap">
        <button id="btn-copy" class="btn btn-primary">复制模板</button>
        <button id="btn-submit-close" class="btn btn-ghost">关闭</button>
      </div>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
<script src="js/data/identities.js"></script>
<script src="js/data/events_land.js"></script>
<script src="js/data/events_grow.js"></script>
<script src="js/data/events_settle.js"></script>
<script src="js/data/events_any.js"></script>
<script src="js/data/events_season.js"></script>
<script src="js/data/endings.js"></script>
<script src="js/engine.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>
</body>
</html>
